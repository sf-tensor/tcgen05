[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcgen05-model"
version = "1.0.0"
description = "Bit-accurate software model of NVIDIA Blackwell tcgen05 MMA arithmetic"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "San Francisco Tensor Company"}]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
tcgen05-validate = "tcgen05_model.validation:main"

[tool.setuptools]
packages = ["tcgen05_model"]

[tool.setuptools.package-data]
tcgen05_model = ["MODEL.md"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
